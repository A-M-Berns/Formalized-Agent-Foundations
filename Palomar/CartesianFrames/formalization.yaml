fidelity:
  divergences: >-
    The paper works with arbitrary sets; here a set is a Lean type and the agent,
    environment and world carriers share one universe. No cardinality restriction is
    imposed, and the existential in the conclusion ranges over frames in that same
    universe.

    The Challenge restates the nine definitions it needs rather than importing them
    from the `CartesianFrames` library in this same repository,
    because Palomar restricts a challenge's import closure to Lean core, Mathlib, Tau
    Ceti and CSLib. Each restatement was checked against the upstream library by
    proving an `Iff` between the two renderings of every relation the theorem mentions
    (`Subagent`, `AddSubagent`, `MultSubagent`, and the `BiextEquiv` they are stated up
    to); those bridge lemmas are in the Solution and are what the transport rests on,
    so the correspondence is proved rather than asserted.

    Frame isomorphism is spelled out directly in the Challenge instead of being taken
    from Mathlib's category theory, to keep the statement auditable without category
    theory. It is isomorphism in the paper's `Chu(W)`, and the Solution proves it
    agrees with the upstream categorical rendering.

