status:
  scope: >-
    One theorem: the Decomposition Theorem (Theorem 24, §2.4), which factors the
    subagent relation on Cartesian frames into a multiplicative step followed by an
    additive one. Subagency is stated in the paper's primary categorical form
    (Definition 13); the equivalent currying (Definition 14) and covering
    (Definition 50) presentations are not used, so no equivalence between them is
    assumed. The additive and multiplicative relations are Definitions 18 and 19, the
    direct forms, not the currying variants of Definitions 20 and 21. Nothing else
    from the paper is claimed by this entry.
  # The deliberate placeholder in the Challenge module is excluded, per the v0.4
  # instruction; the Solution has no sorries.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "Palomar.CartesianFrames.Frame.subagent_iff_exists_multSubagent_addSubagent"
      file: "Palomar/CartesianFrames/Solution.lean"
      sorry_count: 0
      axioms:
