name: CI

on:
  push:
    branches: [main, logical-induction, cartesian-frames-formalization, finite-factored-sets, factored-space-models, condensation]
  pull_request:
  # Nightly, so `main` is re-verified against a fresh toolchain download and a
  # cold-ish cache even on days nothing lands. The two second-opinion gates at the
  # end of the build job run on this and on push, never on a pull request; see the
  # comment above them.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      # Blocking, and first: the unit tests for scripts/paper_nodes.py, the shared
      # reader that every node checker below depends on. Needs neither Lean nor network.
      # These guard two silently-disarming holes that reviews did not catch. The audit
      # inventory reader used to absorb *every* identifier-shaped token after
      # `#assert_axioms_clean`, so a declaration written inside the marker block --
      # `lemma foo : True := trivial` -- contributed `lemma`, `foo`, `True` and
      # `trivial` to the inventory, after which the gate believed `foo` was axiom-checked
      # when nothing checked it. The pending-block reader had the mirror hazard once the
      # block grew a `SECTION:` line, `SECTION` being identifier-shaped itself. A checker
      # that passes because it is checking nothing is worse than no checker, so the
      # reader's own tests gate the run before the checkers that trust it.
      - name: Test paper-node readers
        run: python3 scripts/test_paper_nodes.py

      # Blocking, and it runs on pull requests too even though the gates it guards
      # do not: it needs neither toolchain nor network, and its scope assertion is
      # what stops a new `lean_lib` from arriving unclassified — which is a change
      # a pull request makes and a nightly run would only notice afterwards.
      - name: Lean gates self-test and scope check
        run: python3 scripts/lean_gates.py --self-test

      # Blocking: the theorem/lemma sweep has landed and the linter is clean
      # (CLAUDE.md "Working conventions"). Every `theorem` in LogicalInduction/ must
      # carry a paper label, every CF `theorem` a numbered node, and no `private
      # theorem` may occur.
      - name: Lint paper labels
        run: python3 scripts/lint_paper_labels.py

      # Blocking: every `Paper node:` label must resolve to a `\label` in the paper
      # source, and every audited inventory member must carry one (endpoint-inventory.md).
      - name: Check paper-node annotations
        run: ./scripts/check-paper-nodes.sh

      # Blocking: every Cartesian Frames `Paper node:` annotation must name a node
      # actually numbered in the committed paper TeX (most CF nodes have no \label,
      # so the printed Definition/Claim/Theorem numbers are the provenance keys).
      - name: Check Cartesian Frames node annotations
        run: python3 scripts/check-cartesian-frames-nodes.py

      # Blocking: same contract for ModalAgents. That paper labels only 22 of its
      # nodes and leaves several formalized ones unlabeled, so the provenance keys are
      # the printed `<section>.<n>` numbers, recomputed from the committed TeX by
      # emulating its shared section-scoped theorem counter.
      - name: Check ModalAgents node annotations
        run: python3 scripts/check-modal-agents-nodes.py

      # Blocking: same contract for Finite Factored Sets. That paper carries 32 \label
      # commands, only 30 of them on numbered nodes (of 98), and its labels are working
      # names, so the provenance keys are the
      # printed numbers — recomputed from the committed TeX by emulating its
      # *independent, never-resetting* per-environment counters (a different discipline
      # from ModalAgents' single section-scoped counter).
      - name: Check Finite Factored Sets node annotations
        run: python3 scripts/check-finite-factored-sets-nodes.py

      # Blocking: same contract for Condensation. That paper labels nothing and has no
      # arXiv record, and no TeX source for it exists in this project — so the committed
      # source is a `pdftotext -layout` extraction of the PDF and the provenance keys are
      # the printed `<section>.<n>` numbers read off its header lines, not numbers
      # recomputed from counters. Because the extraction is itself provenance-bearing,
      # this checker also asserts that exactly the paper's 42 nodes are derived, so a
      # re-extraction that mangles a header fails here rather than silently shrinking the
      # set of nodes an annotation may name.
      - name: Check Condensation node annotations
        run: python3 scripts/check-condensation-nodes.py

      # Blocking: same contract for Factored Space Models. Five of that paper's fifty
      # nodes carry no \label, so the provenance keys are the printed section-scoped
      # numbers (with lettered appendix sections), recomputed from the committed TeX.
      - name: Check Factored Space Models node annotations
        run: python3 scripts/check-factored-spaces-nodes.py

      # Blocking: docs/trust-surface.html (the read-through guide) must be regenerated
      # whenever any of its inputs changes; the page carries a hash stamp over them.
      - name: Check trust-surface guide freshness
        run: python3 scripts/check_trust_surface.py

      # Blocking: every paper registered in scripts/papers.py is fully wired — source
      # and PDF committed, library inside the axiom gate, node checker present and in
      # CI, README, and covered by the trust-surface guide. Completed papers must also
      # expose a documented API and an isolated client smoke test in the default build.
      # Every lean_lib is either a registered paper or an excused non-paper library.
      # This is what stops a new formalization from shipping half-connected.
      - name: Check paper wiring
        run: python3 scripts/check_paper_wiring.py

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build (default targets incl. all papers, client APIs + AxiomAudit)
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          use-github-cache: true

      # Blocking, and it MUST run after the build: this gate asks Lean itself which
      # Condensation declarations depend on `sorryAx`, and fails unless every one of
      # them is named in AxiomAudit.lean's CONDENSATION-PENDING block (either section).
      # It only *reads* the oleans the build step produced — it never invokes `lake
      # build` — so before that step there is nothing to read and it would report an
      # infrastructure failure. That is why it cannot sit with the other Python checkers
      # above, which need neither Lean nor a build.
      #
      # Why it exists: `#assert_axioms_clean` reaches exactly the names someone
      # remembered to type into it, so a `sorry` in a fresh lemma, in an un-annotated
      # helper, or reintroduced into a finished proof was invisible to every other gate
      # here. It checks both directions — an unrecorded `sorry`, and a ledger entry that
      # outlived the `sorry` it excused (which would leave a proved endpoint parked
      # outside the axiom gate).
      #
      # Exit 2 means infrastructure, not a ledger violation: Lean did not run, produced
      # no parseable report, or an olean was momentarily absent because a build was
      # writing the same checkout concurrently. Re-run rather than editing the ledger.
      - name: Check Condensation sorry ledger (post-build; reads the built oleans)
        run: python3 scripts/check_sorry_ledger.py

      # ---------------------------------------------------------------------
      # Two second opinions on the compiled environment. Not on pull requests:
      # replay's wall time does not belong in the review path, and a pull
      # request is already protected by the build, the node checkers, the
      # enumerated inventory in AxiomAudit.lean and the sorry ledger. These run
      # on push to a listed branch, on the nightly schedule, and on manual
      # dispatch.
      #
      # WHY BOTH, AND WHY BESIDE PALOMAR. Palomar runs Comparator + NanoDa — an
      # independent Rust type checker — over *registration commits*: the deep
      # verification of a frozen snapshot. These gates are the everyday coverage
      # of `main` BETWEEN those freezes. Neither replaces the other. Palomar
      # answers "is this snapshot sound, by an independent implementation";
      # these answer "did anything land on main today that the kernel would not
      # accept, or that carries an axiom nobody declared".
      #
      # WHY BOTH OF THESE, given AxiomAudit.lean. The inventory reaches the
      # names someone typed into `#assert_axioms_clean`; the blanket audit
      # reaches every declaration under each audited root, and sees what no grep
      # can — `native_decide`, whose axiom is minted during compilation and
      # appears in no source file. And every axiom check, this one included,
      # *reads* the environment `lake build` produced; replay re-derives it, so
      # a declaration that entered without the kernel checking it is caught
      # there and nowhere else. Scope and exclusions: scripts/lean_gates.py.
      - name: Kernel replay (post-build; replays the built oleans)
        if: github.event_name != 'pull_request'
        env:
          # The default of one worker per core is what makes a Mathlib-sized
          # replay swap on a two-core runner.
          LEAN_NUM_THREADS: 4
        run: python3 scripts/lean_gates.py --replay

      - name: Blanket axiom audit (post-build; reads the built oleans)
        if: github.event_name != 'pull_request'
        run: python3 scripts/lean_gates.py --audit
